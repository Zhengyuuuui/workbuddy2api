[project]
name = "codebuddy-proxy"
version = "2.0.0"
description = "Local OpenAI/Responses/Anthropic compatible proxy for CodeBuddy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx[socks]>=0.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 本项目是脚本集合（入口在 server/ 下），不是可打包安装的库；
# server/ 也不是 codebuddy_proxy 包目录，hatchling 默认文件选择会失败。
# 标记为非打包项目，uv run 直接以脚本方式运行，不再尝试 editable 构建。
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]
